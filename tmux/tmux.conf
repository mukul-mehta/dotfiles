set -g default-terminal "xterm-256color"
set-option -sa terminal-overrides ",xterm*:Tc"


# change prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# base index
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable Mouse Support
set -g mouse on

# Unbind [ for copy mode and use Esc
unbind [
bind Escape copy-mode

unbind p
bind p paste-buffer

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded!"


# automatically set window title
set -g automatic-rename on
set -g repeat-time 0

# split
bind h split-window -h
bind v split-window -v

# Set vi mode
set-window-option -g mode-keys vi

# Use visual selection mode as vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# Move window to the left
bind -n M-i swap-window -t -1

# Move window to the right
bind -n M-o swap-window -t +1

bind -n C-l send-keys C-l


set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"


TMUX_FZF_ORDER="session|window|pane|command|keybinding"
TMUX_FZF_OPTIONS="-p -w 90% -h 70% -m"

# more options here: https://github.com/sainnhe/tmux-fzf/issues/6#issuecomment-578750879
bind w run-shell -b "$HOME/.local/share/tmux/plugins/tmux-fzf/scripts/window.sh switch"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'erikw/tmux-powerline'

run '$HOME/.local/share/tmux/plugins/tpm/tpm'
